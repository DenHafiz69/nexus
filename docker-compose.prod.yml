services:
  db:
    image: postgres:16
    container_name: nexus_db
    restart: always
    env_file:
      - .env
    volumes:
      - nexus_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nexus_user -d nexus_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: nexus_web
    restart: always
    # Note: Removed --reload and local volume mount for production
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

volumes:
  nexus_db_data:
