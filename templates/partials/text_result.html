<div class="border border-gray-200 rounded-lg p-6 bg-gray-50 mt-4 animate-fade-in relative group">
    <div class="flex justify-between items-center mb-3">
        <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wider">Result</h3>
        <button onclick="copyToClipboard()" class="text-emerald-600 hover:text-emerald-800 transition-colors flex items-center text-sm font-medium group-hover:opacity-100 opacity-70">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            Copy
        </button>
    </div>
    
    <div class="bg-white border border-gray-300 rounded p-4 max-h-96 overflow-y-auto">
        <p id="converted-text-content" class="text-gray-800 whitespace-pre-wrap break-words font-mono text-sm">{{ converted_text }}</p>
    </div>
    
    <!-- Notification Toast -->
    <div id="copy-toast" class="absolute top-4 right-4 bg-gray-800 text-white text-xs px-3 py-1.5 rounded opacity-0 transition-opacity duration-300 pointer-events-none">
        Copied!
    </div>
</div>

<style>
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
    }
</style>

<script>
    function copyToClipboard() {
        const textToCopy = document.getElementById('converted-text-content').innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            const toast = document.getElementById('copy-toast');
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy text: ', err);
        });
    }
</script>
