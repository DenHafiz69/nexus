{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8 text-center">
        <a href="/" class="inline-flex items-center text-indigo-600 hover:text-indigo-800 transition-colors duration-200">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Back to Tools
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-md overflow-hidden">
        <div class="p-8">
            <h2 class="block text-2xl leading-tight font-bold text-black mb-4">QR Generator</h2>
            <p class="mt-2 text-gray-500 mb-6">Enter text or a URL to instantly generate a downloadable QR code.</p>
            
            <form hx-post="/generate-qr" hx-target="#qr-result" class="space-y-4">
                <div>
                    <label for="text" class="sr-only">Text or URL</label>
                    <input type="text" name="text" id="text" required placeholder="Enter text to encode..." 
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md transition-colors duration-200">
                    Generate QR
                </button>
            </form>
            
            <!-- HTMX Target -->
            <div id="qr-result" class="mt-6 flex justify-center"></div>
        </div>
    </div>
</div>
{% endblock %}
