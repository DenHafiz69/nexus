{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-8 text-center">
        <a href="/" class="inline-flex items-center text-emerald-600 hover:text-emerald-800 transition-colors duration-200">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Back to Tools
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-md overflow-hidden">
        <div class="p-8">
            <h2 class="block text-2xl leading-tight font-bold text-black mb-4">Text Case Converter</h2>
            <p class="mt-2 text-gray-500 mb-6">Instantly convert your text between various formats.</p>
            
            <form hx-post="/convert-text" hx-target="#convert-result" class="space-y-6">
                <div>
                    <label for="text" class="block text-sm font-medium text-gray-700 mb-2">Your Text</label>
                    <textarea name="text" id="text" rows="5" required placeholder="Type or paste your text here..." 
                        class="w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm focus:ring-emerald-500 focus:border-emerald-500 resize-y"></textarea>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="case_type" class="block text-sm font-medium text-gray-700 mb-2">Convert To</label>
                        <select name="case_type" id="case_type" 
                            class="w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm rounded-md shadow-sm border">
                            <option value="uppercase">UPPERCASE</option>
                            <option value="lowercase">lowercase</option>
                            <option value="titlecase">Title Case</option>
                            <option value="camelcase">camelCase</option>
                            <option value="snakecase">snake_case</option>
                            <option value="kebabcase">kebab-case</option>
                            <option value="alternatingcase">aLtErNaTiNg cAsE</option>
                        </select>
                    </div>
                    
                    <div class="flex items-end">
                        <button type="submit" 
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded-md transition-colors duration-200 shadow hover:shadow-md">
                            Convert Text
                        </button>
                    </div>
                </div>
            </form>
            
            <!-- HTMX Target -->
            <div id="convert-result" class="mt-8"></div>
        </div>
    </div>
</div>
{% endblock %}
